# =============================================================================
# Calculadora Eléctrica RD — Unified Docker Compose
# =============================================================================
# Orchestrates all services: existing stack + V2 migration services.
#
# Existing services:
#   - frontend: Angular app
#   - api: NestJS backend
#   - mariadb: Current database (until Fase 1 migration)
#   - ollama: Local LLM
#   - openwebui: LLM web interface
#   - prometheus: Metrics
#
# V2 Migration services (new):
#   - postgres: PostgreSQL 16 + PostGIS (will replace MariaDB in Fase 1)
#   - redis: Message broker for Celery async tasks
#   - minio: S3-compatible object storage for plan files
#   - plan-service: Python FastAPI microservice for PDF/DXF processing
#   - celery-worker: Async task processor
#   - adminer: Database management UI (PostgreSQL)
#
# Usage:
#   docker compose up -d              # Start ALL services
#   docker compose up api mariadb     # Start only existing stack
#   docker compose up plan-service    # Start V2 services only
#   docker compose logs -f            # Follow logs
#   docker compose down -v            # Stop and remove volumes
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # EXISTING STACK
  # ===========================================================================

  # Frontend React
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: electridom-frontend
    ports:
      - '8082:80'
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - electridom-network
    environment:
      - NODE_ENV=production

  # Backend NestJS API
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: electridom-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - DATABASE_USERNAME=electridom
      - DATABASE_PASSWORD=electridom123
      - DATABASE_NAME=electridom
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=900s
      - RULE_CACHE_TTL_MS=60000
      - APPLY_MIGRATIONS_ON_STARTUP=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_TIMEOUT_MS=30000
      - METRICS_ENABLED=true
      - CORS_ORIGIN=*
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_LIMIT=100
      - REFRESH_TTL=30d
      - REFRESH_ROTATE=true
      - REFRESH_SALT=your-refresh-salt-here-make-it-long-and-random
      - REFRESH_COOKIE_ENABLED=false
      - PLAN_SERVICE_URL=http://plan-service:8000
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ../../backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - electridom-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MariaDB (current — will be replaced by PostgreSQL in Fase 1)
  mariadb:
    image: mariadb:11
    container_name: electridom-mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_DATABASE=electridom
      - MARIADB_USER=electridom
      - MARIADB_PASSWORD=electridom123
      - MARIADB_ALLOW_EMPTY_PASSWORD=no
      - MARIADB_CHARACTER_SET_SERVER=utf8mb4
      - MARIADB_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    healthcheck:
      test:
        ['CMD', 'mariadb', '-u', 'root', '-prootpassword', '-e', 'SELECT 1;']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama - LLM Local
  ollama:
    image: ollama/ollama:latest
    container_name: electridom-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - electridom-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Open WebUI - Interfaz web para Ollama
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: electridom-openwebui
    ports:
      - '3001:8080'
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=your-secret-key-here
      - DEFAULT_USER_ROLE=admin
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - electridom-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: electridom-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - api

  # ===========================================================================
  # V2 MIGRATION SERVICES (new)
  # ===========================================================================

  # PostgreSQL 16 + PostGIS (will replace MariaDB in Fase 1)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: electridom-postgres
    environment:
      POSTGRES_USER: electridom
      POSTGRES_PASSWORD: electridom
      POSTGRES_DB: electridom
      POSTGRES_MULTIPLE_DATABASES: electridom_plans
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electridom -d electridom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - electridom-network

  # Redis — Message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: electridom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - electridom-network

  # MinIO — S3-compatible object storage for plan files
  minio:
    image: minio/minio:latest
    container_name: electridom-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: electridom
      MINIO_ROOT_PASSWORD: electridom123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - electridom-network

  # Plan Service — Python FastAPI for PDF/DXF processing
  plan-service:
    build:
      context: ../../plan-service
      dockerfile: Dockerfile
    container_name: electridom-plan-service
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://electridom:electridom@postgres:5432/electridom_plans
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: electridom
      MINIO_SECRET_KEY: electridom123
      MINIO_BUCKET: plans
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - electridom-network

  # Celery Worker — Async task processor for plan-service
  celery-worker:
    build:
      context: ../../plan-service
      dockerfile: Dockerfile
    container_name: electridom-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://electridom:electridom@postgres:5432/electridom_plans
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: electridom
      MINIO_SECRET_KEY: electridom123
      MINIO_BUCKET: plans
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - electridom-network

  # Adminer — Database management UI (PostgreSQL)
  adminer:
    image: adminer:latest
    container_name: electridom-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - electridom-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Existing
  mariadb_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  # V2 Migration
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  electridom-network:
    driver: bridge
    name: electridom-network
