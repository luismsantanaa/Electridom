[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-service"
version = "0.1.0"
description = "Plan recognition service for Calculadora Eléctrica RD — PDF/DXF parsing and space detection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [
    { name = "Calculadora Eléctrica RD Team" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.17.0",
    "alembic>=1.14.0",

    # Async tasks
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # File storage
    "minio>=7.2.10",

    # PDF processing
    "PyMuPDF>=1.24.0",
    "pdf2image>=1.17.0",

    # DXF processing
    "ezdxf>=1.3.0",

    # Geometry
    "shapely>=2.0.6",

    # Computer Vision
    "opencv-python-headless>=4.10.0",
    "numpy>=2.1.0",

    # OCR (optional, for raster PDFs)
    # "pytesseract>=0.3.13",
    # "easyocr>=1.7.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",           # For TestClient
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
