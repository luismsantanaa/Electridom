name: CI/CD Pipeline - Monorepo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_ENV: test
  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_USERNAME: electridom_test
  TEST_DB_PASSWORD: electridom_test
  TEST_DB_NAME: electridom_test
  TEST_PORT: 3001
  TEST_JWT_SECRET: test-secret-key-for-ci
  TEST_JWT_EXPIRES_IN: 1h
  TEST_THROTTLE_TTL: 60
  TEST_THROTTLE_LIMIT: 10

jobs:
  # Backend Jobs
  backend-test:
    name: Backend Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: electridom_test
          POSTGRES_PASSWORD: electridom_test
          POSTGRES_DB: electridom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: calculadora-electrica-backend/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            calculadora-electrica-backend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('calculadora-electrica-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: calculadora-electrica-backend
        run: npm ci

      - name: Setup test environment
        working-directory: calculadora-electrica-backend
        run: |
          cp env.example .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "TEST_DB_HOST=localhost" >> .env.test
          echo "TEST_DB_PORT=5432" >> .env.test
          echo "TEST_DB_USERNAME=electridom_test" >> .env.test
          echo "TEST_DB_PASSWORD=electridom_test" >> .env.test
          echo "TEST_DB_NAME=electridom_test" >> .env.test
          echo "TEST_PORT=3001" >> .env.test
          echo "TEST_JWT_SECRET=test-secret-key-for-ci" >> .env.test
          echo "TEST_JWT_EXPIRES_IN=1h" >> .env.test
          echo "TEST_THROTTLE_TTL=60" >> .env.test
          echo "TEST_THROTTLE_LIMIT=10" >> .env.test

      - name: Setup test database
        working-directory: calculadora-electrica-backend
        run: npm run setup:test-db-complete

      - name: Run linting
        working-directory: calculadora-electrica-backend
        run: npm run lint

      - name: Run unit tests with coverage
        working-directory: calculadora-electrica-backend
        run: npm run test:unit:coverage

      - name: Run E2E tests
        working-directory: calculadora-electrica-backend
        run: npm run test:e2e

      - name: Build application
        working-directory: calculadora-electrica-backend
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: calculadora-electrica-backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Check coverage threshold
        working-directory: calculadora-electrica-backend
        run: |
          COVERAGE=$(npm run test:unit:coverage 2>&1 | grep -o 'All files[^%]*' | grep -o '[0-9.]*%' | head -1 | sed 's/%//')
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "Coverage $COVERAGE% is below threshold of 40%"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets threshold"

  backend-quick-check:
    name: Backend Quick Check
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: calculadora-electrica-backend/package-lock.json

      - name: Install dependencies
        working-directory: calculadora-electrica-backend
        run: npm ci

      - name: Run linting only
        working-directory: calculadora-electrica-backend
        run: npm run lint

  # Frontend Jobs
  frontend-test:
    name: Frontend Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: calculadora-electrica-frontend/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            calculadora-electrica-frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('calculadora-electrica-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: calculadora-electrica-frontend
        run: npm ci

      - name: Run linting
        working-directory: calculadora-electrica-frontend
        run: npm run lint

      # TODO: Fix Angular test configuration for Angular 20
      # - name: Run unit tests
      #   working-directory: calculadora-electrica-frontend
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build application
        working-directory: calculadora-electrica-frontend
        run: npm run build

  frontend-quick-check:
    name: Frontend Quick Check
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: calculadora-electrica-frontend/package-lock.json

      - name: Install dependencies
        working-directory: calculadora-electrica-frontend
        run: npm ci

      - name: Run linting only
        working-directory: calculadora-electrica-frontend
        run: npm run lint

  # ===========================================================================
  # Plan Service (Python) Jobs
  # ===========================================================================
  plan-service-test:
    name: Plan Service Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('plan-service/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: plan-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint with ruff
        working-directory: plan-service
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Type check with mypy
        working-directory: plan-service
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: Run tests with coverage
        working-directory: plan-service
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: plan-service/coverage.xml
          flags: plan-service
          name: plan-service-coverage

      - name: Verify Dockerfile builds
        working-directory: plan-service
        run: |
          docker build -t plan-service-test .

  plan-service-quick-check:
    name: Plan Service Quick Check
    runs-on: ubuntu-latest
    needs: plan-service-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: plan-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements/base.txt

      - name: Lint only
        working-directory: plan-service
        run: ruff check app/

  # ===========================================================================
  # Build and Deploy Job
  # ===========================================================================
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, plan-service-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build Backend
        working-directory: calculadora-electrica-backend
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: calculadora-electrica-frontend
        run: |
          npm ci
          npm run build

      - name: Build Plan Service Docker image
        working-directory: plan-service
        run: |
          docker build -t plan-service:${{ github.sha }} .

      - name: Create deployment artifacts
        run: |
          mkdir -p artifacts
          cp -r calculadora-electrica-backend/dist artifacts/backend
          cp -r calculadora-electrica-frontend/dist artifacts/frontend
          cp calculadora-electrica-backend/package*.json artifacts/backend/ 2>/dev/null || true
          cp calculadora-electrica-frontend/package*.json artifacts/frontend/
          cp -r plan-service artifacts/plan-service
          docker save plan-service:${{ github.sha }} | gzip > artifacts/plan-service-image.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: artifacts/
          retention-days: 30

